name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: # Allow manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: npm — disabled: stale NODE_AUTH_TOKEN secret blocks OIDC
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Note: registry-url intentionally omitted to avoid .npmrc
          # token binding that conflicts with OIDC trusted publishing

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public --tag latest --registry https://registry.npmjs.org/
